<!DOCTYPE html>
<html>
<head>
    <title>TaskMaster</title>

    <!-- FullCalendar CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            display: grid;
            grid-template-columns: 200px 1fr 350px;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 3px solid #b3b3b3;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid gray;
            border-radius: 6px;
            background-color: #e6e6e6;
            cursor: pointer;
        }

        /* Calendar */
        #calendar {
            margin: 20px;
            background-color: white;
            border: 3px solid gray;
            padding: 10px;
            height: 80vh;
        }

        /* To-Do List Section */
        .todo-section {
            background-color: #ffffff;
            padding: 20px;
            border-left: 3px solid #b3b3b3;
            overflow-y: auto;
        }

        .todo-section h2 {
            text-align: center;
        }

        .task-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #f8f8f8;
            border-left: 4px solid #6a5acd;
        }

        form button {
            margin-top: 6px;
            padding: 8px 12px;
            background-color: #6a5acd;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <button>Calendar</button>
            <button>To-Do List</button>
            <button>Shop</button>
        </div>

        <!-- Calendar -->
        <div id="calendar"></div>

        <!-- To-Do List -->
        <div class="todo-section">
            <h2>To-Do List</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Add Task</button>
            </form>

            <hr>

            {% for task in tasks %}
                <div class="task-item">
                    <strong>{{ task.title }}</strong><br>
                    {% if task.due_date %}
                        Due: {{ task.due_date }}
                    {% endif %}
                </div>
            {% empty %}
                <p>No tasks yet.</p>
            {% endfor %}
        </div>
    </div>

    <!-- FullCalendar Script -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    let calendarEl = document.getElementById('calendar');

    let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: '/tasks-json/',
        dateClick: function(info) {
            let date = info.dateStr;
            let title = prompt("Task Title:");

            if (title) {
                fetch('/add-task/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        'title': title,
                        'due_date': date
                    })
                })
                .then(response => {
                    if (response.ok) {
                        calendar.refetchEvents(); // refresh calendar
                        window.location.reload(); // refresh To-Do list
                    }
                });
            }
        }
    });

    calendar.render();
});
</script>


</body>
</html>
